<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 ФинПлан — вход</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.login-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    padding: 32px; width: 380px; max-width: 94vw; display: flex; flex-direction: column; gap: 14px; }
.login-card h1 { color: var(--accent); font-size: 1.3rem; text-align: center; }
.login-card .btn { width: 100%; }
.login-error { color: #ff8a80; min-height: 1.2em; font-size: .9rem; text-align: center; }
.login-switch { text-align: center; color: var(--text-secondary); font-size: .9rem; cursor: pointer; }
.consent-group { display: flex; align-items: flex-start; gap: 8px; font-size: .85rem; }
.consent-group input { margin-top: 4px; min-width: 18px; min-height: 18px; cursor: pointer; }
.consent-group label { color: var(--text-secondary); cursor: pointer; line-height: 1.4; }
.consent-group a { color: var(--accent); text-decoration: none; }
.consent-group a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="login-wrap">
    <form class="login-card" id="loginForm">
        <h1>💰 Финансовый Планировщик</h1>
        <div class="form-group"><label>Логин</label><input class="input" id="authUser" autocomplete="username"></div>
        <div class="form-group"><label>Пароль</label><input class="input" id="authPass" type="password" autocomplete="current-password"></div>
        
        <div class="consent-group" id="consentGroup" style="display:none;">
            <input type="checkbox" id="consentCheckbox">
            <label for="consentCheckbox">
                Я согласен с <a href="/privacy" target="_blank">политикой конфиденциальности</a> и даю согласие на обработку моих данных
            </label>
        </div>
        
        <div class="login-error" id="authError"></div>
        <button class="btn btn-primary" id="authSubmit">Войти</button>
        <div class="login-switch" id="authSwitch">Нет аккаунта? Зарегистрироваться</div>
    </form>
</div>
<script>
let mode = 'login';
const consentGroup = document.getElementById('consentGroup');
const consentCheckbox = document.getElementById('consentCheckbox');

document.getElementById('authSwitch').onclick = () => {
    mode = mode === 'login' ? 'register' : 'login';
    document.getElementById('authSubmit').textContent = mode === 'login' ? 'Войти' : 'Создать аккаунт';
    document.getElementById('authSwitch').textContent = mode === 'login'
        ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
    document.getElementById('authError').textContent = '';
    
    // Показываем чекбокс согласия только при регистрации
    consentGroup.style.display = mode === 'register' ? 'flex' : 'none';
};

document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const err = document.getElementById('authError');
    err.textContent = '';
    
    // Проверка согласия при регистрации
    if (mode === 'register' && !consentCheckbox.checked) {
        err.textContent = 'Необходимо согласие с политикой конфиденциальности';
        return;
    }
    
    const res = await fetch('/auth/' + mode, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: document.getElementById('authUser').value,
            password: document.getElementById('authPass').value,
            consent: mode === 'register' ? consentCheckbox.checked : undefined
        })
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error || 'Ошибка'; return; }
    location.href = '/';
};
</script>
</body>
</html>
